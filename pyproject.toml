[project]
name = "excel-agent"
version = "1.0.0"
description = "OfficeMind - 基于 LangGraph 的 Office 文档智能数据分析助手（支持 Excel、PowerPoint、Word）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.9",
    "chromadb>=0.4.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
]

[project.scripts]
excel-agent = "excel_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_agent"]
