<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeMind - Office文档智能数据分析助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --bg-hover: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --border: #333333;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --gradient-1: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --gradient-2: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
            --sidebar-width: 300px;
        }

        /* 亮色主题 */
        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f8f9fa;
            --bg-hover: #e8eaed;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a68;
            --text-muted: #8e8ea0;
            --border: #e1e4e8;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --accent: #5a67d8;
            --accent-hover: #4c51bf;
            --success: #48bb78;
            --warning: #ed8936;
            --error: #f56565;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* 亮色主题下的特殊样式覆盖 */
        [data-theme="light"] .message.assistant {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border: 1px solid #667eea30;
        }

        [data-theme="light"] .message.user .message-content {
            background: linear-gradient(135deg, #f0f4ff 0%, #f5f3ff 100%);
            color: #1e1b4b;
            border: 1px solid #c7d2fe;
        }

        [data-theme="light"] .thinking-block {
            background: #fef3cd;
            border-color: #ffc107;
        }

        [data-theme="light"] .thinking-header {
            color: #856404;
        }

        [data-theme="light"] .thinking-content {
            color: #664d03;
        }

        [data-theme="light"] .tool-block {
            background: #e8f4fd;
            border-color: #90cdf4;
        }

        [data-theme="light"] .tool-header {
            color: #2b6cb0;
        }

        [data-theme="light"] .tool-name {
            background: #3182ce;
            color: white;
        }

        [data-theme="light"] .tool-result.success {
            background: #c6f6d5;
            border-color: #48bb78;
            color: #22543d;
        }

        [data-theme="light"] .tool-result.error {
            background: #fed7d7;
            border-color: #fc8181;
            color: #742a2a;
        }

        [data-theme="light"] .upload-zone {
            background: #f8fafc;
            border-color: #cbd5e0;
        }

        [data-theme="light"] .upload-zone:hover,
        [data-theme="light"] .upload-zone.dragover {
            background: #edf2f7;
            border-color: var(--accent);
        }

        [data-theme="light"] .table-item {
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }

        [data-theme="light"] .table-item:hover {
            background: #f7fafc;
            border-color: #a0aec0;
        }

        [data-theme="light"] .table-item.active {
            background: linear-gradient(135deg, #667eea10 0%, #764ba210 100%);
            border-color: var(--accent);
        }

        [data-theme="light"] .chat-input {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: var(--text-primary);
        }

        [data-theme="light"] .chat-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(90, 103, 216, 0.15);
        }

        [data-theme="light"] .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        [data-theme="light"] .knowledge-item {
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }

        [data-theme="light"] .knowledge-item:hover {
            background: #f7fafc;
        }

        [data-theme="light"] .btn-join {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        [data-theme="light"] .modal {
            background: #ffffff;
        }

        [data-theme="light"] .active-table-indicator {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* 主题切换按钮 */
        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .theme-toggle-btn:hover {
            background: var(--bg-hover);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Left Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-header h1::before {
            content: "📊";
            font-size: 1.3rem;
        }

        .sidebar-header .subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Upload Section */
        .upload-section {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 20px 12px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: var(--bg-tertiary);
        }

        .upload-zone:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }

        .upload-zone.drag-over {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.15);
        }

        .upload-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .upload-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .upload-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        #file-input {
            display: none;
        }

        /* Tables Section */
        .tables-section {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .tables-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .tables-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tables-count {
            background: var(--accent);
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 8px;
        }

        .btn-clear-all {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            transition: color 0.2s;
        }

        .btn-clear-all:hover {
            color: var(--error);
        }

        .tables-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .table-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            gap: 8px;
        }

        .table-item:hover {
            background: var(--bg-hover);
            border-color: var(--border);
        }

        .table-item.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--accent);
        }

        .table-item.selected {
            border-color: var(--warning);
            background: rgba(245, 158, 11, 0.1);
        }

        .table-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--warning);
            cursor: pointer;
            flex-shrink: 0;
        }

        .table-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .table-icon {
            font-size: 1rem;
            flex-shrink: 0;
        }

        .table-info {
            flex: 1;
            min-width: 0;
        }

        .table-name {
            font-weight: 500;
            font-size: 0.8rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .table-meta {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .table-delete {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
            flex-shrink: 0;
            opacity: 0;
        }

        .table-item:hover .table-delete {
            opacity: 1;
        }

        .table-delete:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .tables-empty {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Join Button */
        .join-btn-container {
            padding: 8px 0;
            margin-top: auto;
        }

        .btn-join {
            width: 100%;
            padding: 10px 16px;
            background: var(--gradient-2);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-join:hover {
            transform: scale(1.02);
        }

        .btn-join:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 16px;
            width: 450px;
            max-width: 90%;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-select option {
            background: var(--bg-tertiary);
        }

        .form-warning {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 10px 12px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--warning);
            margin-bottom: 16px;
        }

        .table-preview {
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 8px 0;
        }

        .btn-add-key {
            background: transparent;
            border: 1px dashed var(--accent);
            color: var(--accent);
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
        }

        .btn-add-key:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .key-pair-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: nowrap;
        }

        .key-select-group {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .key-select-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .key-pair-row select {
            width: 100%;
            min-width: 0;
            padding: 8px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85rem;
        }

        .key-pair-row select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .key-pair-arrow {
            font-size: 1rem;
            color: var(--text-muted);
            flex-shrink: 0;
            padding-top: 18px;
        }

        .btn-remove-key {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            padding-top: 18px;
        }

        .btn-remove-key:hover {
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-cancel {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: var(--bg-tertiary);
            border-color: var(--text-muted);
        }

        .btn-confirm {
            padding: 10px 24px;
            background: var(--gradient-2);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-confirm:hover {
            transform: scale(1.02);
        }

        .btn-confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-width: 0;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .active-table-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent);
            border-radius: 16px;
            font-size: 0.95rem;
            color: var(--accent);
            max-width: 400px;
        }

        .active-table-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .active-table-indicator span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .active-table-indicator:empty {
            display: none;
        }

        /* Upload Overlay */
        .upload-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .upload-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .upload-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .upload-overlay-text {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .upload-overlay-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--bg-tertiary);
            border-radius: 16px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .status-badge.loaded {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-badge.loaded .status-dot {
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Chat Section */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
        }

        .chat-empty-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .chat-empty h3 {
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .message {
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-content {
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
        }

        .message.user .message-content {
            background: var(--gradient-1);
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .table-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--bg-primary);
            color: var(--text-muted);
            margin-bottom: 6px;
            border: 1px solid var(--border);
        }

        .table-badge.current {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Markdown */
        .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
            font-size: 0.9rem;
        }

        .message-content th,
        .message-content td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        .message-content th {
            background: var(--bg-hover);
            font-weight: 600;
        }

        .message-content pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            border: 1px solid var(--border);
        }

        .message-content code {
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .message-content pre code {
            background: transparent;
            padding: 0;
        }

        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4 {
            margin-top: 16px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .message-content ul,
        .message-content ol {
            padding-left: 20px;
            margin: 8px 0;
        }

        .message-content p {
            margin-bottom: 8px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        /* Thinking & Tool Blocks */
        .thinking-block,
        .tool-block {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            font-size: 0.875rem;
        }

        .thinking-block {
            border-left: 3px solid var(--accent);
        }

        /* 可折叠的思考块样式 */
        .thinking-block details {
            cursor: pointer;
        }

        .thinking-block summary {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            font-weight: 500;
            list-style: none;
            user-select: none;
        }

        .thinking-block summary::-webkit-details-marker {
            display: none;
        }

        .thinking-block summary::before {
            content: '▶';
            font-size: 0.7rem;
            transition: transform 0.2s;
        }

        .thinking-block details[open] summary::before {
            transform: rotate(90deg);
        }

        .thinking-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .thinking-content {
            color: var(--text-secondary);
            white-space: pre-wrap;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            max-height: 300px;
            overflow-y: auto;
        }

        .thinking-block.finished {
            border-left-color: var(--border);
            opacity: 0.8;
        }

        .thinking-block.finished .thinking-header,
        .thinking-block.finished summary {
            color: var(--text-secondary);
        }

        .tool-block {
            border-left: 3px solid var(--warning);
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--warning);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .tool-name {
            background: rgba(245, 158, 11, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }

        .tool-args,
        .tool-result {
            background: var(--bg-primary);
            padding: 10px 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            overflow-x: auto;
            margin-top: 8px;
        }

        .tool-result {
            max-height: 200px;
            overflow-y: auto;
        }

        .tool-result.has-chart {
            max-height: none;
            overflow: visible;
        }

        .tool-result.success {
            border-left: 2px solid var(--success);
        }

        .tool-result.error {
            border-left: 2px solid var(--error);
        }

        /* 工具描述样式 */
        .tool-description {
            color: var(--text-primary);
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .tool-description b {
            color: var(--accent);
        }

        .tool-details {
            margin-top: 8px;
        }

        .tool-details summary {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 4px 0;
        }

        .tool-details summary:hover {
            color: var(--text-secondary);
        }

        /* 结果显示样式 */
        .result-value {
            color: var(--success);
            font-weight: 600;
        }

        .result-meta {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .result-data-preview {
            margin-top: 8px;
        }

        .result-data-preview summary {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .result-data-preview pre {
            background: var(--bg-primary);
            padding: 8px;
            border-radius: 4px;
            overflow-x: auto;
            max-height: 150px;
            font-size: 0.75rem;
        }

        .tool-result code {
            background: rgba(99, 102, 241, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8rem;
        }

        /* Chart Container Styles */
        .chart-result-container {
            margin-top: 12px;
        }

        .chart-header {
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .chart-container {
            width: 100%;
            height: 400px;
            min-height: 400px;
            background: rgba(17, 24, 39, 0.6);
            border-radius: 12px;
            padding: 16px;
            box-sizing: border-box;
        }

        /* Input Section */
        .chat-input-container {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
            flex-shrink: 0;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            max-width: 800px;
            margin: 0 auto;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            min-height: 52px;
            max-height: 150px;
            line-height: 1.5;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .chat-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-btn {
            background: var(--gradient-1);
            border: none;
            border-radius: 12px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .loading-dots {
            display: inline-flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        /* Right Sidebar: Knowledge Base */
        .right-sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
            padding: 16px;
        }

        .knowledge-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .knowledge-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .knowledge-count {
            background: var(--success);
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 8px;
        }

        .knowledge-actions {
            display: flex;
            gap: 4px;
        }

        .kb-btn-small {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 4px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .kb-btn-small:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .knowledge-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            flex: 1;
            margin-top: 8px;
        }

        .knowledge-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            gap: 10px;
        }

        .knowledge-item:hover {
            background: var(--bg-hover);
            border-color: var(--border);
        }

        .knowledge-item.selected {
            background: rgba(34, 197, 94, 0.15);
            border-color: var(--success);
        }

        .knowledge-icon {
            font-size: 1rem;
            flex-shrink: 0;
        }

        .knowledge-info {
            flex: 1;
            min-width: 0;
        }

        .knowledge-name {
            font-weight: 500;
            font-size: 0.8rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .knowledge-meta {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .knowledge-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .knowledge-tag {
            font-size: 0.6rem;
            padding: 1px 6px;
            background: rgba(99, 102, 241, 0.2);
            color: var(--accent);
            border-radius: 4px;
        }

        .knowledge-delete {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
            flex-shrink: 0;
            opacity: 0;
        }

        .knowledge-item:hover .knowledge-delete {
            opacity: 1;
        }

        .knowledge-delete:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .knowledge-empty {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .knowledge-upload-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 12px 8px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: var(--bg-tertiary);
            margin-top: 8px;
        }

        .knowledge-upload-zone:hover {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .knowledge-upload-zone.drag-over {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.15);
        }

        .knowledge-upload-icon {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .knowledge-upload-text {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        /* Knowledge Modal */
        .kb-modal {
            width: 550px;
        }

        .kb-modal-body {
            max-height: 60vh;
            overflow-y: auto;
        }

        .kb-content-preview {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
        }

        .kb-content-input {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            resize: vertical;
            font-family: inherit;
        }

        .kb-content-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .kb-tags-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .kb-tags-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .kb-info-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .kb-info-item {
            flex: 1;
        }
    </style>
</head>

<body>
    <!-- Left Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>OfficeMind</h1>
                <button id="theme-toggle" class="theme-toggle-btn" title="切换主题">🌙</button>

        <div class="upload-section">

            <input type="file" id="file-input" accept=".xlsx,.xls,.xlsm,.pptx,.ppt,.docx,.doc" multiple>

        <div class="tables-section">

                <div class="tables-title">

                    <span class="tables-count" id="tables-count">0</span>

            <div class="join-btn-container">
                <button class="btn-join" id="btn-join" disabled>
                    🤖 智能联表
                </button>
            </div>
        </div>
    </aside>

    <!-- Join Modal -->
    <div class="modal-overlay" id="join-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>🔗 表格联查</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">新表名称</label>
                    <input type="text" class="form-input" id="join-name" placeholder="例如：用户订单联合表">
                </div>

                <div class="table-preview" id="table1-preview"></div>
                <div class="table-preview" id="table2-preview"></div>

                <div class="form-group">
                    <label class="form-label">连接字段 <button type="button" class="btn-add-key" id="btn-add-key">+
                            添加字段</button></label>
                    <div id="key-pairs-container">
                        <!-- Key pairs will be added here dynamically -->
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">连接类型</label>
                    <select class="form-select" id="join-type">
                        <option value="inner">inner - 仅保留匹配行</option>
                        <option value="left">left - 保留左表全部</option>
                        <option value="right">right - 保留右表全部</option>
                        <option value="outer">outer - 保留全部行</option>

                <div class="form-warning">

            <div class="modal-footer">

                <button class="btn-confirm" id="join-confirm">确认连接</button>

    <!-- Knowledge Base Modal -->
    <div class="modal-overlay" id="kb-modal">
        <div class="modal kb-modal">
            <div class="modal-header">
                <h2 id="kb-modal-title">📚 知识详情</h2>
                <button class="modal-close" id="kb-modal-close">&times;</button>
            </div>
            <div class="modal-body kb-modal-body">
                <div class="form-group">
                    <label class="form-label">标题</label>
                    <input type="text" class="form-input" id="kb-title" placeholder="知识条目标题">
                </div>
                <div class="form-group">
                    <label class="form-label">内容</label>
                    <textarea class="kb-content-input" id="kb-content" placeholder="输入知识内容..."></textarea>

                <div class="kb-info-row">

                        <select class="form-select" id="kb-category">
                            <option value="general">通用</option>
                            <option value="field_rule">字段规则</option>
                            <option value="task_pattern">任务模式</option>
                            <option value="business_logic">业务逻辑</option>
                        </select>
                    </div>
                    <div class="kb-info-item">
                        <label class="form-label">优先级</label>
                        <select class="form-select" id="kb-priority">

    <!-- Right Sidebar: Knowledge Base -->
    <aside class="right-sidebar">
        <div class="knowledge-header">

                📚 知识库
                <span class="knowledge-count" id="knowledge-count">0</span>
            </div>
            <div class="knowledge-actions">
                <button class="kb-btn-small" id="kb-btn-add" title="添加知识">+</button>

        <div class="knowledge-upload-zone" id="kb-upload-zone">
            <div class="knowledge-upload-icon">📄</div>
            <p class="knowledge-upload-text">拖拽或点击上传 (.md/.txt)</p>
        </div>
        <input type="file" id="kb-file-input" accept=".md,.txt,.markdown" style="display:none">
    </aside>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script>
        marked.setOptions({ breaks: true, gfm: true });

        // Elements
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const tablesList = document.getElementById('tables-list');
        const tablesCount = document.getElementById('tables-count');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const btnClearAll = document.getElementById('btn-clear-all');
        const btnJoin = document.getElementById('btn-join');
        const joinModal = document.getElementById('join-modal');
        const modalClose = document.getElementById('modal-close');
        const joinCancel = document.getElementById('join-cancel');
        const joinConfirm = document.getElementById('join-confirm');
        const joinName = document.getElementById('join-name');
        const keyPairsContainer = document.getElementById('key-pairs-container');
        const btnAddKey = document.getElementById('btn-add-key');
        const joinType = document.getElementById('join-type');
        const table1Preview = document.getElementById('table1-preview');
        const table2Preview = document.getElementById('table2-preview');
        const uploadOverlay = document.getElementById('upload-overlay');
        const uploadOverlayText = document.getElementById('upload-overlay-text');
        const uploadOverlaySub = document.getElementById('upload-overlay-sub');
        const activeTableIndicator = document.getElementById('active-table-indicator');

        let isProcessing = false;
        let conversationHistory = [];
        let tables = [];
        let activeTableId = null;
        let tableNames = {};
        let selectedTableIds = [];
        let table1Columns = [];
        let table2Columns = [];

        // 主题切换相关
        const themeToggle = document.getElementById('theme-toggle');
        let currentTheme = localStorage.getItem('theme') || 'dark';
        const chartInstances = []; // 存储所有图表实例

        // 初始化主题
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateThemeIcon();

        themeToggle.addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
            updateThemeIcon();
            updateChartsTheme();
        });

        function updateThemeIcon() {
            themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        }

        function updateChartsTheme() {
            const theme = currentTheme === 'light' ? null : 'dark';
            chartInstances.forEach(item => {
                if (item.chart && !item.chart.isDisposed()) {
                    const originalOption = item.originalOption || item.chart.getOption();
                    item.chart.dispose();
                    const newChart = echarts.init(item.container, theme);

                    // 应用主题相关的颜色覆盖
                    let chartOptions = { ...originalOption };
                    if (currentTheme === 'light') {
                        chartOptions = {
                            ...chartOptions,
                            backgroundColor: '#ffffff',
                            textStyle: { color: '#333333' },
                            title: { ...chartOptions.title, textStyle: { color: '#1a1a2e' } },
                            legend: { ...chartOptions.legend, textStyle: { color: '#4a4a68' } },
                            xAxis: Array.isArray(chartOptions.xAxis)
                                ? chartOptions.xAxis.map(x => ({ ...x, axisLine: { lineStyle: { color: '#ccc' } }, axisLabel: { color: '#666' } }))
                                : { ...chartOptions.xAxis, axisLine: { lineStyle: { color: '#ccc' } }, axisLabel: { color: '#666' } },
                            yAxis: Array.isArray(chartOptions.yAxis)
                                ? chartOptions.yAxis.map(y => ({ ...y, axisLine: { lineStyle: { color: '#ccc' } }, axisLabel: { color: '#666' }, splitLine: { lineStyle: { color: '#eee' } } }))
                                : { ...chartOptions.yAxis, axisLine: { lineStyle: { color: '#ccc' } }, axisLabel: { color: '#666' }, splitLine: { lineStyle: { color: '#eee' } } }
                        };
                    }

                    newChart.setOption(chartOptions);
                    item.chart = newChart;
                }
            });
        }

        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
        uploadZone.addEventListener('drop', (e) => {

        async function handleFiles(files) {
            const validFiles = Array.from(files).filter(f => {
                const ext = '.' + f.name.split('.').pop().toLowerCase();
                return ['.xlsx', '.xls', '.xlsm'].includes(ext);
            });

            if (validFiles.length === 0) return;

            // 显示上传遮罩
            uploadOverlay.classList.add('show');

            for (let i = 0; i < validFiles.length; i++) {
                const file = validFiles[i];
                uploadOverlayText.textContent = `正在上传 (${i + 1}/${validFiles.length}): ${file.name}`;
                uploadOverlaySub.textContent = '请稍候，文件较大时可能需要一些时间';
                await uploadFile(file);
            }

            // 隐藏上传遮罩
            uploadOverlay.classList.remove('show');
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                if (!response.ok) throw new Error((await response.json()).detail || '上传失败');
                const data = await response.json();
                if (data.tables) updateTablesList(data.tables);
                if (data.table_id) {
                    activeTableId = data.table_id;
                    tableNames[data.table_id] = file.name;
                }
            } catch (error) {
                alert('上传失败: ' + error.message);
            }
            updateStatus();
        }

        function updateTablesList(tablesData) {
            tables = tablesData;
            tablesCount.textContent = tables.length;

            updateJoinButton();

            if (tables.length === 0) {
                tablesList.innerHTML = '<div class="tables-empty">暂无数据表</div>';
                return;
            }

            tablesList.innerHTML = '';
            tables.forEach(table => {
                tableNames[table.id] = table.filename;
                const isSelected = selectedTableIds.includes(table.id);
                const icon = table.is_joined ? '🔗' : '📊';
                const tooltip = table.is_joined && table.source_tables
                    ? `连接表：${table.source_tables.join(' + ')}`
                    : table.filename;

                const item = document.createElement('div');
                item.className = `table-item${table.is_active ? ' active' : ''}${isSelected ? ' selected' : ''}`;
                item.dataset.id = table.id;
                item.innerHTML = `
                    <input type="checkbox" class="table-checkbox" ${isSelected ? 'checked' : ''} ${table.is_joined ? 'disabled' : ''}>
                    <div class="table-item-left">
                        <span class="table-icon">${icon}</span>
                        <div class="table-info">
                            <div class="table-name" title="${tooltip}">${table.filename}</div>
                            <div class="table-meta">${table.total_rows}行 × ${table.total_columns}列</div>
                        </div>

                    <button class="table-delete" title="删除">×</button>
                `;

                const checkbox = item.querySelector('.table-checkbox');
                checkbox.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleTableSelection(table.id, checkbox.checked);
                });

                item.addEventListener('click', async (e) => {
                    if (e.target.classList.contains('table-delete') || e.target.classList.contains('table-checkbox')) return;
                    await setActiveTable(table.id);
                });

        async function openJoinModal() {
            if (selectedTableIds.length !== 2) return;

            const [id1, id2] = selectedTableIds;
            const t1 = tables.find(t => t.id === id1);
            const t2 = tables.find(t => t.id === id2);

            // 显示AI分析遮罩
            uploadOverlayText.textContent = '🤖 AI 正在分析表结构...';
            uploadOverlaySub.textContent = '请稍候，AI正在智能匹配联表字段';
            uploadOverlay.classList.add('show');

            table1Preview.textContent = `表1: ${t1?.filename} (${t1?.total_rows}行)`;
            table2Preview.textContent = `表2: ${t2?.filename} (${t2?.total_rows}行)`;

            // 获取列名
            try {
                const [cols1, cols2] = await Promise.all([
                    fetch(`/tables/${id1}/columns`).then(r => r.json()),
                    fetch(`/tables/${id2}/columns`).then(r => r.json())
                ]);

                table1Columns = cols1.columns || [];
                table2Columns = cols2.columns || [];
            } catch (e) {
                uploadOverlay.classList.remove('show');
                alert('获取列信息失败');
                return;
            }

            // 调用AI建议API
            let aiSuggestion = null;
            try {
                const response = await fetch('/tables/suggest-join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ table1_id: id1, table2_id: id2 })
                });

                if (response.ok) {
                    const data = await response.json();
                    aiSuggestion = data.suggestion;
                }
            } catch (e) {
                console.warn('AI建议获取失败，使用默认值', e);
            }

            uploadOverlay.classList.remove('show');

            // 清空并添加字段对
            keyPairsContainer.innerHTML = '';

            if (aiSuggestion && aiSuggestion.keys1 && aiSuggestion.keys2) {
                // 使用AI建议预填充
                joinName.value = aiSuggestion.new_name || `${t1?.filename?.split('.')[0]}_${t2?.filename?.split('.')[0]}_联合`;
                joinType.value = aiSuggestion.join_type || 'inner';

                // 添加AI建议的字段对
                for (let i = 0; i < aiSuggestion.keys1.length; i++) {
                    addKeyPair(aiSuggestion.keys1[i], aiSuggestion.keys2[i]);
                }

                // 显示AI建议原因
                if (aiSuggestion.reason) {
                    console.log('AI建议原因:', aiSuggestion.reason);
                }
            } else {
                // 默认值
                joinName.value = `${t1?.filename?.split('.')[0] || '表1'}_${t2?.filename?.split('.')[0] || '表2'}_联合`;
                addKeyPair();
            }

            joinModal.classList.add('show');
        }

        // Chat handlers

        });
